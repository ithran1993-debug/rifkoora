<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ريف كورة | نتائج المباريات المباشرة، الترتيب والأخبار</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-light: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --blue: #3b82f6;
      --live: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Header & Announcement */
    .ticker {
      background: linear-gradient(90deg, #16a34a, #0284c7);
      color: #fff; text-align: center; padding: 8px 14px;
      font-size: 0.88rem; font-weight: 700; display: none;
    }
    header {
      background: #0f172a; border-bottom: 1px solid var(--border);
      padding: 14px 18px; position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 960px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { margin: 0; font-size: 1.3rem; color: #fff; }
    .brand span { font-size: 0.78rem; background: rgba(34,197,94,0.15); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 700; }

    .main-nav { display: flex; gap: 8px; }
    .nav-btn {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer;
      transition: 0.2s; font-size: 0.92rem;
    }
    .nav-btn.active { background: var(--accent); color: #052e16; border-color: var(--accent); }

    .container { max-width: 960px; margin: 16px auto; padding: 0 14px; }
    .section-view { display: none; }
    .section-view.active { display: block; }

    /* Week Days Strip */
    .days-strip {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px;
      scrollbar-width: none;
    }
    .days-strip::-webkit-scrollbar { display: none; }
    .day-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; min-width: 92px; text-align: center; cursor: pointer;
      transition: 0.2s; flex-shrink: 0;
    }
    .day-card.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .day-card .d-name { font-weight: 800; font-size: 0.92rem; display: block; }
    .day-card .d-date { font-size: 0.75rem; opacity: 0.8; display: block; margin-top: 2px; }
    .day-card .d-count { font-size: 0.72rem; background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }

    /* Filter Bar */
    .filter-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
    }
    .live-toggle {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .live-toggle.active { background: rgba(239,68,68,0.18); border-color: var(--live); color: #fca5a5; }
    .dot-live { width: 8px; height: 8px; background: var(--live); border-radius: 50%; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* League Group & Match Card */
    .league-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; margin-bottom: 16px;
    }
    .league-head {
      background: var(--surface-light); padding: 10px 16px; font-weight: 800;
      font-size: 0.95rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .match-row {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .match-row:last-child { border-bottom: none; }
    .match-main {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    }
    .team { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.96rem; }
    .team.home { justify-content: flex-end; text-align: left; }
    .team.away { justify-content: flex-start; text-align: right; }
    .team img { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.06); padding: 2px; }

    .score-box {
      text-align: center; min-width: 96px; background: #0f172a;
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border);
    }
    .score-num { font-size: 1.15rem; font-weight: 900; letter-spacing: 1px; }
    .match-time { font-size: 1rem; font-weight: 800; color: #e2e8f0; }
    .status-pill { font-size: 0.72rem; font-weight: 800; padding: 2px 7px; border-radius: 5px; display: inline-block; margin-top: 3px; }
    .st-live { background: rgba(239,68,68,0.2); color: #f87171; }
    .st-ft { background: rgba(148,163,184,0.15); color: var(--muted); }
    .st-ns { background: rgba(59,130,246,0.18); color: #93c5fd; }

    .match-meta {
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      font-size: 0.78rem; color: var(--muted);
    }

    /* Standings Table */
    .card-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    select {
      background: #0f172a; color: #fff; border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; width: 100%; max-width: 340px;
    }
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 11px 8px; border-bottom: 1px solid var(--border); text-align: center; }
    th:nth-child(2), td:nth-child(2) { text-align: right; }
    th { color: var(--muted); background: #0f172a; font-weight: 700; }
    .st-team-cell { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .st-team-cell img { width: 22px; height: 22px; object-fit: contain; }

    /* News Grid */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .news-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .news-card img { width: 100%; height: 175px; object-fit: cover; background: #0f172a; }
    .news-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .news-tag { font-size: 0.75rem; color: var(--accent); font-weight: 800; }
    .news-card h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
    .news-card p { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    .news-date { margin-top: auto; font-size: 0.75rem; color: var(--muted); padding-top: 8px; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--muted);
      background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div id="announcementBar" class="ticker"></div>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1 id="siteTitle">⚽ ريف كورة</h1>
      <span>مباشر</span>
    </div>
    <nav class="main-nav">
      <button class="nav-btn active" onclick="switchView('matchesView', this)">⚽ المباريات</button>
      <button class="nav-btn" onclick="switchView('standingsView', this)">📊 الترتيب</button>
      <button class="nav-btn" onclick="switchView('newsView', this)">📰 الأخبار</button>
    </nav>
  </div>
</header>

<div class="container">
  <!-- 1. MATCHES VIEW -->
  <div id="matchesView" class="section-view active">
    <div class="days-strip" id="daysStrip"></div>

    <div class="filter-bar">
      <div id="currentDayLabel" style="font-weight: 800; font-size: 0.95rem;"></div>
      <button id="liveOnlyBtn" class="live-toggle" onclick="toggleLiveFilter()">
        <span class="dot-live"></span> المباشر فقط (<span id="liveCount">0</span>)
      </button>
    </div>

    <div id="matchesContainer"></div>
  </div>

  <!-- 2. STANDINGS VIEW -->
  <div id="standingsView" class="section-view">
    <div class="card-panel">
      <label for="leagueStandingSelect" style="display:block; margin-bottom:8px; color:var(--muted); font-weight:700;">اختر البطولة:</label>
      <select id="leagueStandingSelect" onchange="renderStandings()"></select>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>الفريق</th>
              <th>لعب</th>
              <th>فاز</th>
              <th>تعادل</th>
              <th>خسر</th>
              <th>أهداف</th>
              <th>نقاط</th>
            </tr>
          </thead>
          <tbody id="standingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 3. NEWS VIEW -->
  <div id="newsView" class="section-view">
    <div id="newsContainer" class="news-grid"></div>
  </div>
</div>

<script>
  let siteData = {
    settings: { siteTitle: 'ريف كورة', announcement: '' },
    leagues: [],
    matches: [],
    standings: {},
    news: []
  };

  // الحصول على التاريخ المحلي لجهاز الزائر بصيغة YYYY-MM-DD
  function getLocalDateISO(dateInput = new Date()) {
    const d = new Date(dateInput);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // تحويل توقيت المباراة إلى التوقيت المحلي للزائر (HH:MM)
  function getLocalMatchTime(match) {
    if (match.timestamp) {
      const d = new Date(match.timestamp);
      if (!isNaN(d.getTime())) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }
    }
    return match.time || '20:00';
  }

  // استخراج التاريخ المحلي للمباراة لمطابقته مع شريط الأيام بدقة
  function getLocalMatchDate(match) {
    if (match.timestamp) {
      const d = new Date(match.timestamp);
      if (!isNaN(d.getTime())) return getLocalDateISO(d);
    }
    return match.date;
  }

  let selectedLocalDate = getLocalDateISO();
  let liveOnly = false;

  function switchView(viewId, btn) {
    document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    btn.classList.add('active');
  }

  function toggleLiveFilter() {
    liveOnly = !liveOnly;
    document.getElementById('liveOnlyBtn').classList.toggle('active', liveOnly);
    renderMatches();
  }

  function renderDaysStrip() {
    const strip = document.getElementById('daysStrip');
    strip.innerHTML = '';
    const daysAr = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    for (let i = -1; i <= 5; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const iso = getLocalDateISO(d);
      const label = i === 0 ? 'اليوم' : i === 1 ? 'غداً' : i === -1 ? 'أمس' : daysAr[d.getDay()];
      const count = siteData.matches.filter(m => getLocalMatchDate(m) === iso).length;

      const card = document.createElement('div');
      card.className = 'day-card' + (iso === selectedLocalDate ? ' active' : '');
      card.innerHTML = `
        <span class="d-name">${label}</span>
        <span class="d-date">${iso.slice(5)}</span>
        <span class="d-count">${count}</span>
      `;
      card.onclick = () => {
        selectedLocalDate = iso;
        liveOnly = false;
        document.getElementById('liveOnlyBtn').classList.remove('active');
        renderDaysStrip();
        renderMatches();
      };
      strip.appendChild(card);
    }
  }

  function renderMatches() {
    const container = document.getElementById('matchesContainer');
    const allLive = siteData.matches.filter(m => m.status === 'LIVE');
    document.getElementById('liveCount').innerText = allLive.length;

    let filtered = liveOnly
      ? allLive
      : siteData.matches.filter(m => getLocalMatchDate(m) === selectedLocalDate);

    document.getElementById('currentDayLabel').innerText = liveOnly
      ? `🔴 المباريات الجارية الآن (${filtered.length})`
      : `📅 جدول مباريات ${selectedLocalDate} (${filtered.length})`;

    if (!filtered.length) {
      container.innerHTML = `<div class="empty-state">لا توجد مباريات مجدولة في هذا التوقيت.</div>`;
      return;
    }

    // تجميع المباريات حسب البطولة
    const groups = {};
    filtered.forEach(m => {
      const lg = m.league || 'بطولات متنوعة';
      if (!groups[lg]) groups[lg] = [];
      groups[lg].push(m);
    });

    // ترتيب البطولات وفق ترتيبها المعتمد
    const leagueOrderMap = new Map((siteData.leagues || []).map(l => [l.name, l.order]));
    const sortedLeagueNames = Object.keys(groups).sort((a, b) => {
      return (leagueOrderMap.get(a) ?? 99) - (leagueOrderMap.get(b) ?? 99);
    });

    const fallbackLogo = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2394a3b8"><circle cx="12" cy="12" r="10"/></svg>';

    container.innerHTML = sortedLeagueNames.map(lgName => {
      const rows = groups[lgName].map(m => {
        const localTime = getLocalMatchTime(m);
        let centerHtml = '';
        if (m.status === 'LIVE') {
          centerHtml = `
            <div class="score-num">${m.scoreHome ?? 0} - ${m.scoreAway ?? 0}</div>
            <span class="status-pill st-live">مباشر ${m.minute || ''}</span>
          `;
        } else if (m.status === 'FT') {
          centerHtml = `
            <div class="score-num">${m.scoreHome ?? 0} - ${m.scoreAway ?? 0}</div>
            <span class="status-pill st-ft">انتهت</span>
          `;
        } else {
          centerHtml = `
            <div class="match-time">${localTime}</div>
            <span class="status-pill st-ns">لم تبدأ</span>
          `;
        }

        const metaParts = [];
        if (m.channel) metaParts.push(`📺 ${m.channel}`);
        if (m.commentator) metaParts.push(`🎙️ ${m.commentator}`);
        if (m.stadium) metaParts.push(`🏟️ ${m.stadium}`);

        return `
          <div class="match-row">
            <div class="match-main">
              <div class="team home">
                <span>${m.home}</span>
                <img src="${m.homeLogo || fallbackLogo}" onerror="this.src='${fallbackLogo}'" alt="" />
              </div>
              <div class="score-box">${centerHtml}</div>
              <div class="team away">
                <img src="${m.awayLogo || fallbackLogo}" onerror="this.src='${fallbackLogo}'" alt="" />
                <span>${m.away}</span>
              </div>
            </div>
            ${metaParts.length ? `<div class="match-meta">${metaParts.join(' • ')}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="league-box">
          <div class="league-head">
            <span>🏆 ${lgName}</span>
            <span style="font-size:0.8rem; color:var(--muted);">${groups[lgName].length}</span>
          </div>
          ${rows}
        </div>
      `;
    }).join('');
  }

  function populateStandingsSelect() {
    const sel = document.getElementById('leagueStandingSelect');
    const availableLeagues = Object.keys(siteData.standings || {});
    if (!availableLeagues.length) {
      sel.innerHTML = '<option value="">لا تتوفر جداول ترتيب حالياً</option>';
      return;
    }
    const prev = sel.value;
    sel.innerHTML = availableLeagues.map(name => `<option value="${name}">${name}</option>`).join('');
    if (prev && availableLeagues.includes(prev)) sel.value = prev;
  }

  function renderStandings() {
    const league = document.getElementById('leagueStandingSelect').value;
    const tbody = document.getElementById('standingsBody');
    const rows = (siteData.standings && siteData.standings[league]) || [];

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted); padding:20px;">لا توجد بيانات ترتيب لهذه البطولة حالياً.</td></tr>';
      return;
    }

    const fallbackLogo = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2394a3b8"><circle cx="12" cy="12" r="10"/></svg>';

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td><strong>${r.rank}</strong></td>
        <td>
          <div class="st-team-cell">
            <img src="${r.logo || fallbackLogo}" onerror="this.src='${fallbackLogo}'" alt="" />
            <span>${r.team}</span>
          </div>
        </td>
        <td>${r.played}</td>
        <td>${r.win}</td>
        <td>${r.draw}</td>
        <td>${r.lose}</td>
        <td>${r.gf}:${r.ga}</td>
        <td><strong style="color:var(--accent);">${r.points}</strong></td>
      </tr>
    `).join('');
  }

  function renderNews() {
    const container = document.getElementById('newsContainer');
    const news = siteData.news || [];
    if (!news.length) {
      container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">لا توجد أخبار منشورة حالياً.</div>';
      return;
    }
    container.innerHTML = news.map(n => `
      <article class="news-card">
        ${n.image ? `<img src="${n.image}" alt="${n.title}" onerror="this.style.display='none'" />` : ''}
        <div class="news-body">
          <span class="news-tag">${n.league || 'أخبار الرياضة'}</span>
          <h3>${n.title}</h3>
          <p>${n.summary || ''}</p>
          <div class="news-date">📅 ${n.date || ''}</div>
        </div>
      </article>
    `).join('');
  }

  async function fetchSiteData() {
    try {
      const res = await fetch(`data.json?t=${Date.now()}`);
      if (!res.ok) return;
      siteData = await res.json();

      if (siteData.settings?.siteTitle) {
        document.getElementById('siteTitle').innerText = `⚽ ${siteData.settings.siteTitle}`;
        document.title = `${siteData.settings.siteTitle} | النتائج المباشرة والترتيب`;
      }
      const ticker = document.getElementById('announcementBar');
      if (siteData.settings?.announcement) {
        ticker.innerText = `📢 ${siteData.settings.announcement}`;
        ticker.style.display = 'block';
      } else {
        ticker.style.display = 'none';
      }

      renderDaysStrip();
      renderMatches();
      populateStandingsSelect();
      renderStandings();
      renderNews();
    } catch (e) {
      console.error('Error loading data.json:', e);
    }
  }

  // التحميل الأولي + تحديث تلقائي كل 60 ثانية للأهداف والنتائج المباشرة
  fetchSiteData();
  setInterval(fetchSiteData, 60000);
</script>
</body>
</html>
