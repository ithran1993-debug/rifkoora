name: Auto Live Scores & Weekly Data

on:
  schedule:
    - cron: '0 8,16,23 * * *' # يعمل 3 مرات يومياً فقط (8 صباحاً، 4 عصراً، 11 ليلاً بتوقيت UTC)
  workflow_dispatch:          # يتيح لك التشغيل اليدوي في أي لحظة بضغطة زر

permissions:
  contents: write

jobs:
  update-sports-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Live Scraper
        run: node scripts/scraper.js

      - name: Commit and Push Updates
        run: |
          git config --global user.name "RifKoora Bot"
          git config --global user.email "bot@rifkoora.github.io"
          git add data.json app_data.json draft_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update weekly matches & standings" && git push)
