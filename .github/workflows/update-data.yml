name: Auto Live Scores & Weekly Data

on:
  schedule:
    - cron: '*/5 * * * *' # يعمل تلقائياً كل 5 دقائق على مدار الساعة
  workflow_dispatch:      # يتيح التشغيل اليدوي في أي وقت

permissions:
  contents: write

jobs:
  update-sports-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Live Scraper
        run: node scripts/scraper.js

      - name: Commit and Push Updates
        run: |
          git config --global user.name "RifKoora Bot"
          git config --global user.email "bot@rifkoora.github.io"
          git add data.json app_data.json draft_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live scores, week matches & standings" && git push)
